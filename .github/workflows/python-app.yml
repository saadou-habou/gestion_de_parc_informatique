# This workflow will install Python dependencies, run tests, and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Django CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (dont le groupe dev, pour flake8)
        run: uv sync --group dev

      - name: Lint with flake8
        run: |
          # Stoppe le build s'il y a des erreurs de syntaxe ou des noms non définis
          uv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Le reste est signalé sans faire échouer le build (exit-zero)
          uv run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Django system check
        run: uv run python manage.py check

      - name: Vérifier qu'aucune migration ne manque
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: uv run python manage.py test parc_informatique

        