{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe réinitialisé — Parc Informatique</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'parc_informatique/css/main.css' %}">
</head>
<body style="background: radial-gradient(circle at top left, #1c2044, #0c0e1f 60%); min-height:100vh;">

<div class="d-flex align-items-center justify-content-center" style="min-height:100vh; padding:1.5rem;">
    <div class="pi-card pi-fade-in text-center" style="width:100%; max-width:420px;">
        <div class="pi-card-body p-4">
            <div class="pi-stat-icon mx-auto mb-3" style="background:var(--pi-success-bg); color:var(--pi-success); width:56px; height:56px; font-size:1.3rem;">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h4 class="mb-2">Mot de passe mis à jour</h4>
            <p class="text-muted" style="font-size:.9rem;">Vous pouvez maintenant vous connecter avec votre nouveau mot de passe.</p>
            <a href="{% url 'parc_informatique:login' %}" class="btn btn-pi-primary d-inline-flex align-items-center gap-2 mt-2">
                <i class="fa-solid fa-right-to-bracket"></i> Se connecter
            </a>
        </div>
    </div>
</div>
</body>
</html>
