{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accès refusé — Parc Informatique</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'parc_informatique/css/main.css' %}">
</head>
<body style="background:var(--pi-bg);">
    <div class="d-flex flex-column align-items-center justify-content-center text-center" style="min-height:100vh; padding:2rem;">
        <div class="pi-stat-icon mb-4" style="background:var(--pi-warning-bg); color:var(--pi-warning); width:64px;height:64px;font-size:1.5rem;">
            <i class="fa-solid fa-lock"></i>
        </div>
        <h1 style="font-size:5rem; color:var(--pi-warning); margin-bottom:0;">403</h1>
        <h4 class="mb-2">Accès refusé</h4>
        <p class="text-muted mb-4" style="max-width:420px;">
            Votre rôle ne vous donne pas accès à cette action. Contactez un
            administrateur si vous pensez qu'il s'agit d'une erreur.
        </p>
        <a href="/dashboard/" class="btn btn-pi-primary d-flex align-items-center gap-2">
            <i class="fa-solid fa-house"></i> Retour au tableau de bord
        </a>
    </div>
</body>
</html>
