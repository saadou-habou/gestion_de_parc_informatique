[project]
name = "gestion-de-parc-informatique"
version = "0.1.0"
description = "Application Django de gestion de parc informatique"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django>=5.2,<6.0",
    "django-environ>=0.14.0",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "python-dotenv>=1.0",
    "qrcode[pil]>=8.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "flake8>=7.3.0",
    "ruff>=0.16.1",
    "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "gestion_parc.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[tool.flake8]
max-line-length = 127
exclude = [".git", ".venv", "__pycache__", "migrations"]

[tool.ruff]
line-length = 127
exclude = ["migrations", ".venv"]
